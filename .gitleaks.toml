# gitleaks secret-scan config for OpenPocketCine.
# Extends the built-in ruleset and allowlists values that are known-safe for
# this repo. See docs/commit-hygiene.md for the policy this enforces.
title = "OpenPocketCine secret scan"

[extend]
useDefault = true

[allowlist]
description = "Repo-specific known-safe values and paths"
regexes = [
  # Persisted Frame.io destination preference identifier; both history matches compare this key.
  '''^opc\.frameio\.destination\.v1$''',
  # Operator-preference storage keys. They are named `<AREA>_..._KEY = "dotted.path.vN"`, which is
  # the exact shape `generic-api-key` looks for. Deliberately anchored to the dotted-path form
  # these keys use rather than allowlisting the `_KEY` name, so a real credential assigned to a
  # `_KEY` constant is still caught.
  '''^(assist|display|link|media|monitor|scope)\.[A-Za-z0-9.]+\.v[0-9]+$''',
]
paths = [
  # This config talks about secret patterns on purpose.
  '''\.gitleaks\.toml$''',
]
