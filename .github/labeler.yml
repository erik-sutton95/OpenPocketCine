# Automatic area labels for pull requests.
# actions/labeler v5 requires each label to contain match configuration objects.

"area:core":
  - changed-files:
      - any-glob-to-any-file:
          - "Sources/OpenPocketViewCore/**/*"

"area:protocol":
  - changed-files:
      - any-glob-to-any-file:
          - "Sources/OpenPocketViewCore/Duml*.swift"
          - "Sources/OpenPocketViewCore/Commands.swift"
          - "Sources/OpenPocketViewCore/Camera*.swift"
          - "Sources/OpenPocketViewCore/Ble*.swift"
          - "Sources/OpenPocketViewCore/Connection*.swift"
          - "docs/protocol-notes.md"
          - "handbook/**/*"
          - "tools/**/*"

"area:ios":
  - changed-files:
      - any-glob-to-any-file:
          - "ios/OpenPocketCine/**/*"
          - "ios/project.yml"

"area:live-view":
  - changed-files:
      - any-glob-to-any-file:
          - "Sources/OpenPocketViewCore/Hevc*.swift"
          - "ios/OpenPocketCine/Hevc*.swift"
          - "ios/OpenPocketCine/LiveView*.swift"
          - "ios/OpenPocketCine/VideoView.swift"
          - "ios/OpenPocketCine/DatalinkDriver.swift"

"area:monitoring":
  - changed-files:
      - any-glob-to-any-file:
          - "ios/OpenPocketCine/Assists/**/*"
          - "ios/OpenPocketCine/LiveAssists.swift"
          - "ios/OpenPocketCine/LiveMonitorFx.swift"
          - "Sources/OpenPocketViewCore/*Assist*.swift"
          - "Sources/OpenPocketViewCore/*Scope*.swift"

"area:control":
  - changed-files:
      - any-glob-to-any-file:
          - "Sources/OpenPocketViewCore/Commands.swift"
          - "ios/OpenPocketCine/CameraSession.swift"

"area:media":
  - changed-files:
      - any-glob-to-any-file:
          - "Sources/OpenPocketViewCore/Media*.swift"
          - "Sources/OpenPocketViewCore/*LUT*.swift"
          - "ios/OpenPocketCine/Media*.swift"
          - "ios/OpenPocketCine/*LUT*.swift"

"area:ui":
  - changed-files:
      - any-glob-to-any-file:
          - "ios/OpenPocketCine/*View.swift"
          - "ios/OpenPocketCine/*View*.swift"
          - "ios/OpenPocketCine/Design*.swift"
          - "ios/OpenPocketCine/Branding.swift"
          - "ios/OpenPocketCine/StartupChrome.swift"

"area:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**/*"
          - ".github/**/*"
          - "README.md"
          - "CONTRIBUTING.md"
          - "handbook/**/*"

"area:android":
  - changed-files:
      - any-glob-to-any-file:
          - "Apps/Android/**/*"
          - "Sources/OpenPocketCineAndroidFacade/**/*"
          - "Sources/CJNI/**/*"
          - "scripts/android-*.sh"
