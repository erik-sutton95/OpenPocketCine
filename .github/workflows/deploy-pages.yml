name: Deploy GitHub Pages

# Landing page (site/) plus the Starlight handbook at /docs/ (protocol, apps,
# setup). Engineering contracts in docs/ (PARITY, live-session, …) are never
# uploaded.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "handbook/**"
      - "scripts/check-site.sh"
      - "scripts/stage-pages.sh"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure public beta link
        env:
          TESTFLIGHT_URL: ${{ vars.TESTFLIGHT_URL }}
        run: |
          if [[ -n "$TESTFLIGHT_URL" ]]; then
            if [[ ! "$TESTFLIGHT_URL" =~ ^https://testflight\.apple\.com/join/[A-Za-z0-9]+$ ]]; then
              echo "::error::Set TESTFLIGHT_URL to a public Apple TestFlight join URL, or leave it unset."
              exit 1
            fi
            find site -name '*.html' -exec sed -i "s#TESTFLIGHT_URL#${TESTFLIGHT_URL}#g" {} +
          fi

      - name: Verify landing-page tree
        run: ./scripts/check-site.sh --deployed

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: handbook/package-lock.json

      - name: Stage landing page and handbook
        run: ./scripts/stage-pages.sh public-site

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public-site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
