name: Diag inspector fixture iterations

# Diagnostic only: keep the original product pin and repeat the actual blocked-worker
# lifecycle test. This workflow and its evidence plumbing never merge to main.
on:
  push:
    branches: ["diag/conformance-iterations"]

permissions:
  contents: read

jobs:
  iterate:
    name: Blocked inspector fixture (10 repetitions)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Install native tooling
        run: brew install just xcodegen || true
      - name: Check out unchanged pinned OpenCine
        run: scripts/checkout-opencine.sh
      - name: Build the app and unit tests
        run: |
          just ios-generate
          xcodebuild -project ios/OpenPocketCine.xcodeproj -scheme OpenPocketCine \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ~/ci-dd \
            -skipMacroValidation -skipPackagePluginValidation ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            build-for-testing -quiet
      - name: Create a private simulator
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          udid=$(../OpenCine/scripts/ios-private-simulator.py create "opc-inspector-fixture-$GITHUB_RUN_ID" \
            --report "$RUNNER_TEMP/diag/simulator.json")
          echo "DIAG_UDID=$udid" >> "$GITHUB_ENV"
      - name: Verify all ten blocked-worker lifecycle repetitions
        shell: bash
        env:
          TEST_RUNNER_CI: "true"
        run: |
          set -euo pipefail
          xcodebuild -project ios/OpenPocketCine.xcodeproj -scheme OpenPocketCine \
            -destination "platform=iOS Simulator,id=$DIAG_UDID" -derivedDataPath ~/ci-dd \
            -parallel-testing-enabled NO -test-iterations 10 \
            -resultBundlePath "$RUNNER_TEMP/diag/unit.xcresult" \
            -only-testing:OpenPocketCineTests/AssistInspectorLifecycleTests/testBlockedRenderKeepsItsSlotAcrossActualInspectorDismissalAndRemount \
            test-without-building 2>&1 | tee "$RUNNER_TEMP/diag/test.log"
          python3 - <<'CHECK'
          import os
          from pathlib import Path
          log = (Path(os.environ["RUNNER_TEMP"]) / "diag/test.log").read_text()
          case = "Test Case '-[OpenPocketCineTests.AssistInspectorLifecycleTests testBlockedRenderKeepsItsSlotAcrossActualInspectorDismissalAndRemount]' passed ("
          count = sum(case in line for line in log.splitlines())
          if count != 10:
              raise SystemExit(f"Expected ten passing executions of the actual test, observed {count}")
          print("Verified ten passing executions of the actual blocked-worker lifecycle test")
          CHECK
      - name: Delete the private simulator
        if: always()
        run: |
          if [ -n "${DIAG_UDID:-}" ]; then
            ../OpenCine/scripts/ios-private-simulator.py delete "$DIAG_UDID"
          fi
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inspector-fixture-repetitions
          path: ${{ runner.temp }}/diag
          retention-days: 3
          if-no-files-found: error
