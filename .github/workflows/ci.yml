name: CI

# One suite per pull request. `push` of feat/** (etc.) used to run in parallel
# with `pull_request` for the same SHA, so GitHub listed every job twice and
# CI gate failed twice whenever anything failed. Post-merge coverage is `push`
# to main. Re-run a branch without a PR via workflow_dispatch.
#
# Required check on `main` is **CI gate**. Native / Android / handbook skip when
# their paths did not change; skip is success. Do not add those job names to
# branch protection — a skipped required check blocks the PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists changed PR files via the API

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Meta checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        # Digest-pinned for reproducibility. Update the version manually when needed. v8.30.1
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: "detect --source=. --redact --no-banner --config=.gitleaks.toml"

      - name: Repository hygiene
        run: ./scripts/check-repository-hygiene.sh

      - name: Landing-page assets
        run: ./scripts/check-site.sh

      - name: TestFlight notes
        run: |
          ./scripts/ios-release-notes-check.sh
          ./scripts/ios-release-notes-test.sh

      - name: Require reviewed notes for TestFlight-triggering pull requests
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA"...HEAD)"
          if grep -Eq '^(Sources/|Tests/|ios/|Package\.swift$|scripts/|justfile$)' <<< "$changed_files"; then
            if ! grep -Fxq 'ios/TestFlight/WhatToTest.en-US.txt' <<< "$changed_files"; then
              echo "Update ios/TestFlight/WhatToTest.en-US.txt with plain-language changes and test steps." >&2
              exit 1
            fi
          fi

      - name: Spell check
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: "--no-progress --offline --exclude-path vendor --exclude-path ref --exclude-path docs/design --exclude-path site ."
          fail: true

      - name: EditorConfig check
        uses: editorconfig-checker/action-editorconfig-checker@d2ed4fd072ae6f887e9407c909af0f585d2ad9f4 # v2

      - name: Actionlint
        # Digest-pinned for reproducibility. Update the version manually when needed. v1.7.12
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: "-color"

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      android: ${{ steps.filter.outputs.android }}
      handbook: ${{ steps.filter.outputs.handbook }}
    steps:
      # `dorny/paths-filter` fetches the base ref to diff on push / dispatch, which
      # needs the checkout's git credentials — so this job keeps them (unlike the
      # others). It runs no repository code, so the token is never exposed to
      # untrusted code.
      #
      # On push it runs `git fetch origin <base> <head>`. A head like `docs/foo`
      # (workflow_dispatch on a slash branch) is a git refspec (`docs:foo`), so we
      # fetch the default branch with an explicit refspec and keep enough history
      # that the merge-base already exists and that fetch is skipped.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch default branch for path filter
        run: |
          set -euo pipefail
          default_branch="${{ github.event.repository.default_branch }}"
          git fetch --no-tags origin \
            "refs/heads/${default_branch}:refs/remotes/origin/${default_branch}"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            code:
              - 'Sources/**'
              - 'Tests/**'
              - 'ios/**'
              - 'Package.swift'
              - '.swift-format'
              - 'justfile'
              - '.github/workflows/ci.yml'
            android:
              - 'Apps/Android/**'
              - 'Sources/OpenPocketViewCore/**'
              - 'Sources/OpenPocketCineAndroidFacade/**'
              - 'Sources/CJNI/**'
              - 'Package.swift'
              - 'scripts/android-*.sh'
              - 'scripts/ci-install-swift-android.sh'
              - 'justfile'
              - '.github/workflows/ci.yml'
            handbook:
              - 'handbook/**'
              - 'scripts/stage-pages.sh'
              - '.github/workflows/deploy-pages.yml'

  native:
    name: Native Swift/iOS
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && !github.event.repository.private }}
    # Hosted macOS is free on public repositories. Skip while the repo is private so this
    # job does not burn paid minutes. Never move it to a self-hosted runner — it runs
    # `just native-check` from the pull request, so a fork PR would execute attacker-controlled
    # code on a persistent machine.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Install native tooling
        run: brew install just swift-format xcodegen || true
      - name: Run native checks
        run: just native-check

  android:
    name: Android
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Do not use skiptools/swift-android-action: it references actions/cache@v5 and
      # reactivecircus/android-emulator-runner@v2, which SHA pinning rejects even when
      # those steps are skipped. Ubuntu 24.04 runners already ship Swift 6.3.3.
      # The runner image does not export ANDROID_NDK_HOME; the install script
      # needs NDK 27 for the Swift Android SDK sysroot.
      - name: Set up Android NDK 27
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410 # v1.5.0
        with:
          ndk-version: r27c
          link-to-sdk: true
      - name: Install Swift Android SDK
        run: ./scripts/ci-install-swift-android.sh

      - name: Build, unit-test, and lint
        working-directory: Apps/Android
        env:
          SWIFT_ANDROID_SDK_ID: swift-6.3.3-RELEASE_android
        run: ./gradlew assembleDebug test lint

  handbook:
    name: Protocol handbook
    needs: changes
    if: ${{ needs.changes.outputs.handbook == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: handbook/package-lock.json
      - name: Install handbook dependencies
        run: npm --prefix handbook ci
      - name: Build handbook at /docs/
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          HANDBOOK_BASE: /docs
        run: npm --prefix handbook run build

  gate:
    name: CI gate
    # The single required status check on `main` (name must stay "CI gate"). `native`,
    # `android`, and `handbook` are conditional, and a required check that never reports
    # leaves a pull request blocked forever — so this job always runs and collapses every
    # other job's result into one verdict. Path-filter skips and private-repo native/
    # android skips are success.
    if: always()
    needs: [meta, changes, native, android, handbook]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed or been deliberately skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a CI job reported '$result'"
                exit 1
                ;;
            esac
          done
          echo "All CI jobs passed or were skipped: $RESULTS"
