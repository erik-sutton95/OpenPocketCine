name: CI

# One suite per pull request. `push` of feat/** (etc.) used to run in parallel
# with `pull_request` for the same SHA, so GitHub listed every job twice and
# CI gate failed twice whenever anything failed. Post-merge coverage is `push`
# to main. Re-run a branch without a PR via workflow_dispatch.
#
# Required check on `main` is **CI gate**. Native / Android / handbook skip when
# their paths did not change; skip is success. Do not add those job names to
# branch protection — a skipped required check blocks the PR.
#
# Two tiers (docs/ci.md): this is the fast PR tier. nightly.yml calls it with
# `full: true`, which runs every job regardless of paths and adds the simulator
# conformance suite and the iPad storage oracle.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run every job regardless of paths, plus the nightly-only suites
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists changed PR files via the API

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Meta checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Warn when the OpenCine pin is behind
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pin="$(awk '$1 == "OpenCine" { print $2; exit }' opencine-pins.txt)"
          core_sha="$(git ls-remote https://github.com/erik-sutton95/OpenCine.git refs/heads/main | cut -f1 || true)"
          if [ -z "$pin" ] || [ -z "$core_sha" ] || [ "$pin" = "$core_sha" ]; then
            exit 0
          fi
          ahead="$(gh api "repos/erik-sutton95/OpenCine/compare/${pin}...${core_sha}" --jq '.ahead_by' 2>/dev/null || true)"
          if [ -n "$ahead" ] && [ "$ahead" != "0" ]; then
            echo "::warning::OpenCine pin ${pin:0:7} is ${ahead} commits behind Core main ${core_sha:0:7}"
          fi

      # The app's release-note scripts delegate to the pinned shared validators.
      - name: Check out pinned OpenCine for shared metadata checks
        run: scripts/checkout-opencine.sh

      - name: Gitleaks
        # Digest-pinned for reproducibility. Update the version manually when needed. v8.30.1
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        # The container's uid differs from the checkout owner on some runner images, and
        # git then refuses the repo ("dubious ownership"). Mark the workspace safe via env.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          # Scan this candidate and every ancestor, excluding unrelated fetched branches.
          args: "detect --source=. --redact --no-banner --log-opts=HEAD --config=.gitleaks.toml"

      - name: Repository hygiene
        run: ./scripts/check-repository-hygiene.sh

      - name: Sentry release configuration
        # OpenCine's shared Sentry tooling, run against this app's Xcode Cloud archive hook.
        run: |
          OPC_APP_ROOT=. OPC_APP_NAME=OpenPocketCine bash ../OpenCine/scripts/sentry/sentry-test.sh
          python3 tools/ios-package-resolved-check.py
          bash scripts/ios-package-resolved-test.sh

      - name: Packaged iOS privacy regression
        run: python3 -m unittest discover -s tools -p 'test_ios_archive_privacy.py'

      - name: Connection stress harness (offline)
        run: python3 -m unittest discover -s tools/connection-stress -p 'test_*.py'

      - name: TestFlight notes
        run: |
          ./scripts/ios-release-notes-check.sh
          ./scripts/ios-release-notes-test.sh

      - name: Play closed-testing notes
        run: |
          ./scripts/android-release-notes-check.sh
          ./scripts/android-release-notes-test.sh
          ./scripts/prepare-android-testers-test.sh

      - name: Spell check
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: "--no-progress --offline --exclude-path vendor --exclude-path ref --exclude-path docs/design ."
          fail: true

      - name: EditorConfig check
        # editorconfig-checker 4.0 renamed its release assets; the v2 action only knows `ec-*`.
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0

      - name: Actionlint
        # Digest-pinned for reproducibility. Update the version manually when needed. v1.7.12
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: "-color"

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # The pin bot dispatches CI on bot/pin-core after a GITHUB_TOKEN push, which
      # does not trigger pull_request. Run the shared-core jobs as if the pin changed.
      # The nightly full suite runs every job.
      code: ${{ steps.filter.outputs.code == 'true' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'bot/pin-core') || inputs.full }}
      android: ${{ steps.filter.outputs.android == 'true' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'bot/pin-core') || inputs.full }}
      handbook: ${{ steps.filter.outputs.handbook == 'true' || inputs.full }}
    steps:
      # `dorny/paths-filter` fetches the base ref to diff on push / dispatch, which
      # needs the checkout's git credentials — so this job keeps them (unlike the
      # others). It runs no repository code, so the token is never exposed to
      # untrusted code.
      #
      # On push it runs `git fetch origin <base> <head>`. A head like `docs/foo`
      # (workflow_dispatch on a slash branch) is a git refspec (`docs:foo`), so we
      # fetch the default branch with an explicit refspec and keep enough history
      # that the merge-base already exists and that fetch is skipped.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch default branch for path filter
        run: |
          set -euo pipefail
          default_branch="${{ github.event.repository.default_branch }}"
          git fetch --no-tags origin \
            "refs/heads/${default_branch}:refs/remotes/origin/${default_branch}"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            code:
              - 'Sources/**'
              - 'Tests/**'
              - 'ios/**'
              - 'Package.swift'
              - 'opencine-pins.txt'
              - 'scripts/checkout-opencine.sh'
              - '.swift-format'
              - 'justfile'
              - '.github/workflows/ci.yml'
            android:
              - 'Apps/Android/**'
              - 'Sources/OpenPocketViewCore/**'
              - 'Sources/OpenPocketCineAndroidFacade/**'
              - 'Package.swift'
              - 'opencine-pins.txt'
              - 'scripts/checkout-opencine.sh'
              - 'scripts/android-*.sh'
              - 'scripts/ci-install-swift-android.sh'
              - 'justfile'
              - '.github/workflows/ci.yml'
            handbook:
              - 'handbook/**'
              - 'scripts/check-handbook-links.py'
              - 'justfile'
              - '.lycheeignore'
              - '.github/workflows/ci.yml'

  native:
    name: Native Swift/iOS
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && !github.event.repository.private }}
    # Hosted macOS is free on public repositories. Skip while the repo is private so this
    # job does not burn paid minutes. Never move it to a self-hosted runner — it runs
    # `just native-check` from the pull request, so a fork PR would execute attacker-controlled
    # code on a persistent machine.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Install native tooling
        run: brew install just swift-format xcodegen || true
      # Candidate: Package.swift and ios/project.yml take MonitorUI, MonitorPresentation,
      # OpenCineCore and its products, OpenCineDJI and OpenCineMulticam from the one OpenCine
      # sibling checkout at ../OpenCine, pinned by SHA in opencine-pins.txt. Works only once that
      # repository is published. Delete when the app pins it by url + version.
      - name: Check out pinned OpenCine next to the repository
        run: scripts/checkout-opencine.sh
      # Nightly tier: a second private simulator boot (docs/ci.md).
      - name: Original storage oracle on a private native 2x iPad
        if: ${{ inputs.full }}
        env:
          TEST_RUNNER_CI: "true"
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/native-storage-oracle"
          mkdir -p "$evidence"
          just ios-generate
          udid=""
          trap 'if [ -n "$udid" ]; then python3 ../OpenCine/scripts/ios-private-simulator.py delete "$udid"; fi' EXIT
          udid=$(python3 ../OpenCine/scripts/ios-private-simulator.py create \
            "opc-pocket-storage-2x-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --device "iPad Pro 11-inch (M4)" --report "$evidence/simulator-setup.json")
          xcodebuild -project ios/OpenPocketCine.xcodeproj -scheme OpenPocketCine \
            -destination "platform=iOS Simulator,id=$udid" -parallel-testing-enabled NO \
            -resultBundlePath "$evidence/storage-oracle.xcresult" \
            -only-testing:OpenPocketCineTests/MonitorPortraitHeaderClearanceTests/testCompactDeclaredGaugeRetainsClearanceWhenSafeTopChanges test
      - name: Retain original storage oracle evidence
        if: ${{ always() && inputs.full }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-storage-oracle-evidence
          path: ${{ runner.temp }}/native-storage-oracle
          retention-days: 7
          if-no-files-found: error
      - name: Run native checks
        # Xcode forwards TEST_RUNNER_ variables into the test host.
        # Preserve the existing hosted-CI versus hardware timing contract.
        env:
          TEST_RUNNER_CI: "true"
        run: |
          just swift-test
          just ios-test -skip-testing:OpenPocketCineTests/MonitorPortraitHeaderClearanceTests/testCompactDeclaredGaugeRetainsClearanceWhenSafeTopChanges
          just ios-build watch-build

  conformance:
    name: Shared conformance scenarios, iOS
    needs: changes
    # Nightly tier, QUARANTINE (docs/ci.md). Hosted macOS, public repositories only, for the same
    # reasons as `native`: it runs code from the pull request.
    if: ${{ inputs.full && needs.changes.outputs.code == 'true' && !github.event.repository.private }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Install native tooling
        run: brew install just xcodegen || true
      - name: Check out pinned OpenCine next to the repository
        run: scripts/checkout-opencine.sh
      # OpenCine's scripts/ios-private-simulator.py: a new iPhone 16 Pro with accessibility enabled in
      # its own preference store only, the setup every app's conformance job shares.
      - name: Create a private simulator with accessibility enabled
        run: |
          mkdir -p "$RUNNER_TEMP/conformance-ios"
          udid=$(../OpenCine/scripts/ios-private-simulator.py create \
            "opc-pocket-conformance-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --report "$RUNNER_TEMP/conformance-ios/simulator-setup.json")
          echo "CONFORMANCE_DEVICE_ID=$udid" >> "$GITHUB_ENV"
      - name: Run the shared scenarios (OpenPocketCineUIReview)
        run: just conformance-ios "$CONFORMANCE_DEVICE_ID" "$RUNNER_TEMP/conformance-ios/OpenPocketCineUIReview.xcresult"
      - name: Delete the private simulator
        if: always()
        run: |
          if [ -n "${CONFORMANCE_DEVICE_ID:-}" ]; then
            ../OpenCine/scripts/ios-private-simulator.py delete "$CONFORMANCE_DEVICE_ID"
          fi
      - name: Retain conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-ios-evidence
          path: ${{ runner.temp }}/conformance-ios
          retention-days: 7
          if-no-files-found: warn

  android:
    name: Android
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # OpenCine candidate wiring. Apps/Android/settings.gradle.kts includes ../../../OpenCine/Android
      # (named build `opencine`: core, media, vulkan, multicam, monitor-ui), and the Swift Android
      # core links OpenCineMedia, OpenCineMotion, OpenCineRelay and OpenCineDJI from ../OpenCine: one
      # sibling checkout pinned by SHA in opencine-pins.txt. Works only once that remote exists.
      - name: Check out pinned OpenCine next to the repository
        run: scripts/checkout-opencine.sh

      # Do not use skiptools/swift-android-action: it references actions/cache@v5 and
      # reactivecircus/android-emulator-runner@v2, which SHA pinning rejects even when
      # those steps are skipped. The script installs Swift 6.3.3 if the runner's differs.
      # The runner image does not export ANDROID_NDK_HOME; the install script
      # needs NDK 27 for the Swift Android SDK sysroot.
      - name: Set up Android NDK 27
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27c
          link-to-sdk: true
      - name: Install Swift Android SDK
        run: ./scripts/ci-install-swift-android.sh

      # The release bundle is built on every pull request, as OpenZCine does: R8 only runs there, and
      # :app:verifyReleaseComponentRegistrars (OpenCine's dex check) fails when it strips the ML Kit
      # ComponentRegistrar constructors (OPENPOCKETCINE-ANDROID-18). Unsigned without the Play keystore.
      - name: Build, unit-test, lint, and verify the release bundle
        working-directory: Apps/Android
        env:
          SWIFT_ANDROID_SDK_ID: swift-6.3.3-RELEASE_android
        run: ./gradlew assembleDebug test lint :opencine:monitor-ui:testDebugUnitTest :opencine:monitor-ui:lint :app:verifyReleaseComponentRegistrars

  handbook:
    name: Protocol handbook
    needs: changes
    if: ${{ needs.changes.outputs.handbook == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: handbook/package-lock.json
      - name: Install handbook dependencies
        run: npm --prefix handbook ci
      - name: Build handbook at /openpocketcine/docs/
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          HANDBOOK_BASE: /openpocketcine/docs
        run: |
          npm --prefix handbook run build
          python3 scripts/check-handbook-links.py --base /openpocketcine/docs

  gate:
    name: CI gate
    # The single required status check on `main` (name must stay "CI gate"). `native`,
    # `android`, and `handbook` are conditional, and a required check that never reports
    # leaves a pull request blocked forever — so this job always runs and collapses every
    # other job's result into one verdict. Path-filter skips and private-repo native/
    # android skips are success.
    if: always()
    needs: [meta, changes, native, conformance, android, handbook]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require every job to have passed or been deliberately skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a CI job reported '$result'"
                exit 1
                ;;
            esac
          done
          echo "All CI jobs passed or were skipped: $RESULTS"
