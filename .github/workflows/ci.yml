name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"
      - "ci/**"
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists changed PR files via the API

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Meta checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Repository hygiene
        run: ./scripts/check-repository-hygiene.sh

      - name: Landing-page assets
        run: ./scripts/check-site.sh

      - name: TestFlight notes
        run: |
          ./scripts/ios-release-notes-check.sh
          ./scripts/ios-release-notes-test.sh

      - name: Require reviewed notes for TestFlight-triggering pull requests
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA"...HEAD)"
          if grep -Eq '^(Sources/|Tests/|ios/|Package\.swift$|scripts/|justfile$)' <<< "$changed_files"; then
            if ! grep -Fxq 'ios/TestFlight/WhatToTest.en-US.txt' <<< "$changed_files"; then
              echo "Update ios/TestFlight/WhatToTest.en-US.txt with plain-language changes and test steps." >&2
              exit 1
            fi
          fi

      - name: Spell check
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: "--no-progress --offline --exclude-path vendor --exclude-path ref --exclude-path docs/design --exclude-path site ."
          fail: true

      - name: EditorConfig check
        uses: editorconfig-checker/action-editorconfig-checker@d2ed4fd072ae6f887e9407c909af0f585d2ad9f4 # v2

      - name: Actionlint
        # Digest-pinned for reproducibility. Update the version manually when needed. v1.7.12
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: "-color"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        # Digest-pinned for reproducibility. Update the version manually when needed. v8.30.1
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: "detect --source=. --redact --no-banner --config=.gitleaks.toml"

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      # `dorny/paths-filter` fetches the base ref to diff on push events, which needs the checkout's
      # git credentials — so this job keeps them (unlike the others). It runs no repository code, so
      # the token is never exposed to untrusted code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            code:
              - 'Sources/**'
              - 'Tests/**'
              - 'ios/**'
              - 'Package.swift'
              - '.swift-format'
              - 'justfile'
              - '.github/workflows/ci.yml'
            android:
              - 'Apps/Android/**'
              - 'Sources/OpenPocketViewCore/**'
              - 'Sources/OpenPocketCineAndroidFacade/**'
              - 'Sources/CJNI/**'
              - 'Package.swift'
              - 'scripts/android-*.sh'
              - 'justfile'
              - '.github/workflows/ci.yml'

  native:
    name: Native Swift/iOS
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && !github.event.repository.private }}
    # Hosted macOS is free on public repositories. Skip while the repo is private so this
    # job does not burn paid minutes. Never move it to a self-hosted runner — it runs
    # `just native-check` from the pull request, so a fork PR would execute attacker-controlled
    # code on a persistent machine.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Install native tooling
        run: brew install just swift-format xcodegen || true
      - name: Run native checks
        run: just native-check

  android:
    name: Android
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Swift Android toolchain
        id: swift-android
        uses: skiptools/swift-android-action@2044b79660f201ccef8cbce62877e4ec5409f9c8 # v2.9.5
        with:
          swift-version: '6.3.3'
          ndk-version: '27'
          compile-sdk-api-level: '29'
          build-package: false
          build-tests: false
          run-tests: false

      - name: Build, unit-test, and lint
        working-directory: Apps/Android
        env:
          SWIFT_ANDROID_SDK_ID: swift-6.3.3-RELEASE_android
        run: ./gradlew assembleDebug test lint

  gate:
    name: CI gate
    # The single required status check on `main` (name must stay "CI gate"). `native` and
    # `android` are conditional, and a required check that never reports leaves a pull request
    # blocked forever — so this job always runs and collapses every other job's result into
    # one verdict. Skipped native/android while the repository is still private is success.
    if: always()
    needs: [meta, secrets, changes, native, android]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed or been deliberately skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a CI job reported '$result'"
                exit 1
                ;;
            esac
          done
          echo "All CI jobs passed or were skipped: $RESULTS"
